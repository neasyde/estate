org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=false
org.gradle.workers.max=3
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Network resilience: this network sporadically resets TLS connections mid-download.
# Aggressively retry downloads with backoff; generous timeouts. (Default TLS negotiation.)
systemProp.org.gradle.internal.repository.max.tentatives=20
systemProp.org.gradle.internal.repository.initial.backoff=1500
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000
